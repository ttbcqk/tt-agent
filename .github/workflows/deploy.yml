name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.11.0'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify agent tools
        run: python -m py_compile agents/_tools.py agents/chat/index.py

      - name: Deploy to EdgeOne Makers
        if: env.EDGEONE_API_TOKEN != ''
        continue-on-error: true
        run: npx edgeone makers deploy -n tt-agent -t "$EDGEONE_API_TOKEN"
